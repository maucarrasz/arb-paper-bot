{"name": "paper-bot", "on": {"schedule": [{"cron": "23 */6 * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write", "actions": "write"}, "concurrency": {"group": "paper24x7", "cancel-in-progress": false}, "jobs": {"run": {"runs-on": "ubuntu-latest", "timeout-minutes": 350, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"run": "python -m pip install --quiet requests"}, {"name": "Correr bot continuo ~5h40m (lectura cada 2s)", "run": "timeout 20700 python arb_paper_bot.py --seconds 20400 --interval 2 || true"}, {"name": "Guardar resultados en el repo", "if": "always()", "run": "git config user.name \"arb-paper-bot[actions]\" && git config user.email \"actions@users.noreply.github.com\" && git add opportunities.csv trades.csv && (git commit -m \"data $(date -u +'%Y-%m-%d %H:%M UTC')\" || echo \"sin cambios\") && git pull --rebase --autostash || true && git push"}, {"name": "Encadenar siguiente corrida", "if": "always()", "env": {"GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}, "run": "C=$(gh api \"repos/$GITHUB_REPOSITORY/actions/workflows/paper.yml/runs?status=queued\" --jq .total_count); P=$(gh api \"repos/$GITHUB_REPOSITORY/actions/workflows/paper.yml/runs?status=in_progress\" --jq .total_count); echo \"queued=$C in_progress=$P\"; if [ $((C+P)) -le 1 ]; then gh api -X POST \"repos/$GITHUB_REPOSITORY/actions/workflows/paper.yml/dispatches\" -f ref=main && echo \"siguiente corrida encadenada\"; else echo \"ya hay otra corrida, no encadeno\"; fi"}]}}}
