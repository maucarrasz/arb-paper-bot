{"name": "paper-bot", "on": {"schedule": [{"cron": "23 */6 * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write", "actions": "write"}, "concurrency": {"group": "paper24x7", "cancel-in-progress": false}, "jobs": {"run": {"runs-on": "ubuntu-latest", "timeout-minutes": 350, "steps": [{"name": "Verificar fin del experimento (27-oct)", "id": "fin", "env": {"GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}, "run": "if [ \"$(date -u +%Y%m%d)\" -ge 20281028 ]; then echo 'experimento terminado: deshabilitando workflow'; echo 'expired=true' >> \"$GITHUB_OUTPUT\"; gh api -X PUT \"repos/$GITHUB_REPOSITORY/actions/workflows/paper.yml/disable\" || true; else echo 'expired=false' >> \"$GITHUB_OUTPUT\"; fi"}, {"uses": "actions/checkout@v4", "if": "steps.fin.outputs.expired != 'true'"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}, "if": "steps.fin.outputs.expired != 'true'"}, {"run": "python -m pip install --quiet requests", "if": "steps.fin.outputs.expired != 'true'"}, {"name": "Correr bot continuo ~5h40m (lectura cada 2s, hasta el 27-oct UTC)", "if": "steps.fin.outputs.expired != 'true'", "run": "FIN=$(date -u -d '2026-10-28 00:00:00' +%s); AHORA=$(date -u +%s); S=$((FIN-AHORA)); if [ $S -gt 20400 ]; then S=20400; fi; if [ $S -lt 0 ]; then S=0; fi; echo \"segundos de corrida: $S\"; timeout $((S+300)) python arb_paper_bot.py --seconds $S --interval 2 || true"}, {"name": "Guardar resultados en el repo", "if": "always() && steps.fin.outputs.expired != 'true'", "run": "git config user.name \"arb-paper-bot[actions]\" && git config user.email \"actions@users.noreply.github.com\" && git add opportunities.csv trades.csv && (git commit -m \"data $(date -u +'%Y-%m-%d %H:%M UTC')\" || echo \"sin cambios\") && git pull --rebase --autostash || true && git push"}, {"name": "Encadenar siguiente corrida", "if": "always() && steps.fin.outputs.expired != 'true'", "env": {"GH_TOKEN": "${{ secrets.GITHUB_TOKEN }}"}, "run": "C=$(gh api \"repos/$GITHUB_REPOSITORY/actions/workflows/paper.yml/runs?status=queued\" --jq .total_count); P=$(gh api \"repos/$GITHUB_REPOSITORY/actions/workflows/paper.yml/runs?status=in_progress\" --jq .total_count); echo \"queued=$C in_progress=$P\"; if [ $((C+P)) -le 1 ]; then gh api -X POST \"repos/$GITHUB_REPOSITORY/actions/workflows/paper.yml/dispatches\" -f ref=main && echo \"siguiente corrida encadenada\"; else echo \"ya hay otra corrida, no encadeno\"; fi"}]}}}
