{"name": "paper-bot", "on": {"schedule": [{"cron": "7 */3 * * *"}], "workflow_dispatch": {}}, "permissions": {"contents": "write"}, "jobs": {"run": {"runs-on": "ubuntu-latest", "timeout-minutes": 10, "steps": [{"uses": "actions/checkout@v4"}, {"uses": "actions/setup-python@v5", "with": {"python-version": "3.12"}}, {"run": "python -m pip install --quiet requests"}, {"name": "Correr bot (5 min de muestreo)", "run": "timeout 330 python arb_paper_bot.py --seconds 300 --interval 2 || true"}, {"name": "Guardar resultados en el repo", "run": "git config user.name \"arb-paper-bot[actions]\" && git config user.email \"actions@users.noreply.github.com\" && git add opportunities.csv trades.csv && (git commit -m \"data $(date -u +'%Y-%m-%d %H:%M UTC)\" || echo \"sin cambios\") && git pull --rebase --autostash || true && git push"}]}}}
